name: Add Negocios.IA logo to SEO schema

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-logo-schema:
    if: !startsWith(github.event.head_commit.message, 'chore: apply Negocios.IA logo SEO')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add logo and structured data
        env:
          LOGO_B64: >-
            REPLACE_LOGO_B64
        run: |
          python3 - <<'PY'
          import base64, json, re
          from pathlib import Path

          b64 = '''${LOGO_B64}'''
          Path('assets').mkdir(parents=True, exist_ok=True)
          Path('assets/negocios-ia-logo.jpg').write_bytes(base64.b64decode(b64))

          base = 'https://jawad123-creator.github.io/Negocios.IA/'
          logo = base + 'assets/negocios-ia-logo.jpg'

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'assets/negocios-ia-logo.jpg' in text and '"logo"' in text:
                  continue

              imgs = re.findall(r'<img\\b[^>]*?\\bsrc=["\\']([^"\\']+)', text, flags=re.I)
              first_img = imgs[0] if imgs else None

              def update_ld(m):
                  raw = m.group(1).strip()
                  try:
                      obj = json.loads(raw)
                  except Exception:
                      return m.group(0)

                  typ = obj.get('@type')
                  types = typ if isinstance(typ, list) else [typ]
                  changed = False

                  if 'Article' in types:
                      if first_img and 'image' not in obj:
                          obj['image'] = first_img
                          changed = True
                      pub = obj.get('publisher')
                      if isinstance(pub, dict) and pub.get('@type') == 'Organization':
                          pub['logo'] = {
                              '@type': 'ImageObject',
                              'url': logo,
                              'width': 256,
                              'height': 256
                          }
                          changed = True

                  if 'Organization' in types:
                      obj['logo'] = {
                          '@type': 'ImageObject',
                          'url': logo,
                          'width': 256,
                          'height': 256
                      }
                      changed = True

                  if not changed:
                      return m.group(0)
                  return '<script type="application/ld+json">\\n' + json.dumps(obj, ensure_ascii=False, separators=(',', ':')) + '\\n</script>'

              new_text = re.sub(r'<script\\s+type=["\\']application/ld\\+json["\\']>(.*?)</script>', update_ld, text, flags=re.I|re.S)
              if new_text != text:
                  path.write_text(new_text, encoding='utf-8')

          print('Logo and structured data update complete.')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/negocios-ia-logo.jpg '*.html' 'articulos/*.html' 2>/dev/null || true
          git add .
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'chore: apply Negocios.IA logo SEO'
            git push
          fi
