name: SEO y anuncios
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimizar artículos
        run: python3 scripts/seo_optimize.py
      - name: Commit optimizaciones
        run: |
          git config user.name "seo-optimizer"
          git config user.email "actions@users.noreply.github.com"
          git add articulos scripts/seo_optimize.py .github/workflows/rebuild-ads.yml
          git diff --cached --quiet && exit 0
          git commit -m "SEO: apply automated article optimization"
          git push
